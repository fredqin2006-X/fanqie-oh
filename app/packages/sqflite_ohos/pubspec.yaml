name: sqflite_ohos
repository: https://gitcode.com/CPF-Flutter/flutter_sqflite/master/sqflite_ohos
issue_tracker: https://gitcode.com/CPF-Flutter/flutter_sqflite/issues
description: Ohos flutter plugin for SQLite, a self-contained, high-reliability,
  embedded, SQL database engine.
version: 2.4.2

# This package supports all platforms listed below.
platforms:
  ohos:

topics:
  - sql
  - database

environment:
  sdk: ^3.5.0
  # Flutter versions prior to 3.7 did not support the
  # sharedDarwinSource option.
  flutter: ">=3.7.0"

flutter:
  plugin:
    platforms:
      ohos:
        package: io.flutter.plugins.sqflite
        pluginClass: SqflitePlugin
        dartPluginClass: SqfliteOhos

dependencies:
  flutter:
    sdk: flutter
  path: '>=1.8.0 <4.0.0'
  sqflite_common: '>=2.5.0-1 <4.0.0'
  sqflite_platform_interface: ">=2.4.0-0 <4.0.0"


dev_dependencies:
  flutter_lints: ">=5.0.0"
  process_run: '>=0.12.0'
  http: '>=0.13.0'
  flutter_test:
    sdk: flutter
  test_api: '>=0.2.19'
  pub_semver: '>=2.0.0'
